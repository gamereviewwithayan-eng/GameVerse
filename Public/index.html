<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameVerse</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script src="/socket.io/socket.io.js"></script></head><body><header>🎮 GameVerse <small>ONLINE MULTIPLAYER</small></header><main><section id="lobby" class="panel"><h1>Play together.</h1><p>Five classic games. Invite your friends and play online.</p><label>Your name<input id="name" maxlength="18" value="Player"></label><div id="games" class="games"><button class="selected" data-game="ludo">🎲<br>Ludo</button><button data-game="chess">♟️<br>Chess</button><button data-game="checkers">⛀<br>Checkers</button><button data-game="ttt">❌<br>Tic Tac Toe</button><button data-game="rps">✊<br>Rock Paper Scissors</button></div><p><button id="create" class="primary">Create room</button></p><div class="join"><input id="roomCode" placeholder="ROOM CODE" maxlength="6"><button id="join">Join room</button></div><small>Room starts when all player seats are filled.</small></section><section id="room" class="panel hidden"><button id="leave">← Leave</button><h2 id="title"></h2><p>Room code: <b id="code"></b> <button id="copy">Copy</button></p><div id="players"></div><p id="status"></p><div id="board" class="board"></div><div id="controls"></div><p id="notice"></p></section></main><script src="app.js"></script></body></html>
